description: >-
  Ramre (RamRe) is the brand associated with Ram Reinsurance, now operating as American Overseas
  Group Limited (AOG) — a Bermuda-based insurance holding company that is tax resident in the United
  Kingdom. Through its U.S. subsidiaries the group writes non-standard automobile insurance and
  provides related management services, and it operates as a reinsurer through a subsidiary based in
  Barbados. The company was surfaced as a portfolio company of Canaan Partners and added to the API
  Evangelist network as a stub for enrichment. An enrichment pass found no public developer program,
  API, documentation, or SDK surface: this is a financial-services holding company whose public web
  presence (ramre.com now redirects to aoreltd.com) is corporate and investor-relations oriented,
  with no machine-readable API artifacts to catalog.
